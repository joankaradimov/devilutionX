name: Emscripten deploy

on:
  push:
    branches:
      - master
    paths-ignore:
      - '*.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y gettext ninja-build rsync

    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest

    - name: Build
      run: |
        emcmake cmake -S. -Bbuild-em -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build-em -j $(getconf _NPROCESSORS_ONLN)

    - name: Stage
      run: |
        mkdir dist
        cp build-em/index.html build-em/file-manager.js \
          build-em/devilutionx.js build-em/devilutionx.wasm build-em/devilutionx.data dist/
        cp Packaging/emscripten/.htaccess dist/
        # -R keeps the server's timestamp so rsync skips re-uploading an unchanged file
        curl -fsSLR -o dist/spawn.mpq \
          https://github.com/diasurgical/devilutionx-assets/releases/latest/download/spawn.mpq

    - name: Deploy
      if: ${{ !env.ACT }}
      env:
        SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}
        PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      run: |
        install -m 700 -d ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
        rsync -rtvz --delete --chmod=D755,F644 -e "ssh -p $PORT -i ~/.ssh/deploy_key" dist/ "$TARGET/"
